[package]
name = "shade-crypto"
version = "0.1.0"
edition = "2021"
description = "Poseidon Merkle tree and Groth16 verification shared by the NEAR contract"
license = "MIT"

[dependencies]
ark-bn254 = "0.5.0"
ark-ff = "0.5.0"
ark-groth16 = "0.5.0"
ark-serialize = "0.5.0"
light-poseidon = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
