[profile.default]
src = "src"
out = "out"
script = "script"
test = "test"
libs = ["lib"]
solc = "0.8.28"
via_ir = true
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [{ access = "read", path = "../.." }]

[invariant]
runs = 16
depth = 4
fail_on_revert = false

[fmt]
line_length = 120
