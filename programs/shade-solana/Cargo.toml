[package]
name = "shade-solana"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
insecure-test-setup = []

[dependencies]
groth16-solana = "0.3.1"
pinocchio = { version = "0.10", features = ["cpi"] }
solana-poseidon = "5.0.1"

[dev-dependencies]
# 0.18 does not compile against the crates.io versions it resolves today.
litesvm = "=0.16.0"
serde_json = "1"
solana-address = { version = "=2.6.1", features = ["decode"] }
solana-instruction = "=3.4.1"
solana-instruction-error = "=2.4.0"
solana-keypair = "=3.1.2"
solana-message = "=4.4.1"
solana-sdk-ids = "=3.1.0"
solana-signer = "=3.0.1"
solana-transaction = { version = "=4.1.6", features = ["verify"] }
solana-transaction-error = "=3.3.2"

[build-dependencies]
groth16-solana = { version = "0.3.1", features = ["circom-vk"] }
