name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install circom
        run: |
          curl -fsSL -L https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o /tmp/circom
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Compile circuit and run the devnet setup
        run: npm run circuit:setup
      - name: Test
        run: npm test
      - name: Audit
        run: npm run audit
