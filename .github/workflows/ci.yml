name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install circom
        run: |
          curl -fsSL -L https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64 -o /tmp/circom
          sudo install -m 755 /tmp/circom /usr/local/bin/circom
          circom --version
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Foundry
        run: |
          export FOUNDRY_DIR="$HOME/.foundry"
          curl -L https://foundry.paradigm.xyz | bash
          "$FOUNDRY_DIR/bin/foundryup"
          echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
      - name: Compile circuit and run the devnet setup
        run: npm run circuit:setup
      - name: Forge tests
        run: |
          cd contracts/evm
          forge install foundry-rs/forge-std --no-git
          forge test
      - name: Rust contract tests
        run: |
          cargo test --manifest-path contracts/shade-crypto/Cargo.toml
          cargo test --manifest-path contracts/near/Cargo.toml
          cargo build --release --target wasm32-unknown-unknown --manifest-path contracts/near/Cargo.toml
      - name: Test
        run: npm test
      - name: Audit
        run: npm run audit
