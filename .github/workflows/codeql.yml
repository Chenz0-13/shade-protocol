name: CodeQL

on:
  push:
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    # CodeQL uploads a SARIF result. That upload is the only reason this job
    # can write security events. It cannot push code.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
